name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  snakemake-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Snakemake lint
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: "."
          snakefile: "workflow/Snakefile"
          args: "--lint"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install "snakemake>=9.26.1" pyyaml jsonschema pandas

      - name: Unit tests
        run: python -m unittest discover tests/unit -v

  snakefmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # snakefmt formats shell: blocks with shfmt, so it must be on PATH.
      - name: Install snakefmt and shfmt
        run: |
          pip install snakefmt==2.0.3
          sudo curl -fsSL -o /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt

      - name: snakefmt check
        run: snakefmt --check workflow

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.17.4

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .
