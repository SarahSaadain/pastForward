name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  snakemake-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Snakemake lint
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: "."
          snakefile: "workflow/Snakefile"
          args: "--lint"
