name: reveal_env_git_development
channels:
  - conda-forge
  - bioconda
dependencies:
  # This env intentionally tracks the tip of REVEAL's (https://github.com/SarahSaadain/REVEAL)
  # "develop" branch rather than the bioconda package (see reveal.yaml for that), so we pin its
  # runtime deps directly (same list as REVEAL's own shell/install.sh) and side-load REVEAL itself
  # via the neighboring reveal_git_development.post-deploy.sh.
  - conda-forge::python>=3.10
  - bioconda::pysam
  - conda-forge::numpy
  - conda-forge::pandas
  - conda-forge::r-base>=4.0
  - conda-forge::r-tidyverse>=2.0.0
