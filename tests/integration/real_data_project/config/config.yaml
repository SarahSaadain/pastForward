# Tier 2 test config: real historical Dmel reads (Shpak et al. 2023, PRJNA945389).
# Filled in by tests/integration/real_data_project/download_full_test.sh, which copies this file into the project root it builds.
# Everything not listed here runs with its default (execute: true).

project_name: "pastForward_full_test"

species:
  Dmel:
    name: "Drosophila melanogaster (tier 2 test)"
    # No SCG FASTA is shipped: BUSCO picks the SCGs, so scg_selector is tested too.
    lineage: "drosophilidae_odb12"

pipeline:
  read_module:
    taxonomic_screening:
      tools:
        # Both tools download big databases into resources/ on first use:
        # ECMSD needs 5-10 GB peak, the Centrifuge p+h+v index is 7.9 GB.
        # Set execute: false to skip them on a small machine.
        ecmsd:
          execute: true
        centrifuge:
          execute: true
