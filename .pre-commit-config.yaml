# Optional: `pip install pre-commit && pre-commit install` formats and lints on every commit.
# The two formatters re-stage the files they rewrite, so formatting never fails a commit.
# Uses the tools already on PATH (snakefmt needs shfmt too), same versions as CI.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: bash -c 'ruff format "$@" && git add -- "$@"' --
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: snakefmt
        name: snakefmt
        entry: bash -c 'snakefmt "$@" && git add -- "$@"' --
        language: system
        files: (\.smk|^workflow/Snakefile)$
      - id: snakemake-lint
        name: snakemake lint
        entry: snakemake --lint --snakefile workflow/Snakefile
        language: system
        pass_filenames: false
        files: (\.smk|^workflow/Snakefile|^workflow/envs/)
      - id: unit-tests
        name: unit tests
        entry: python3 -m unittest discover tests/unit
        language: system
        pass_filenames: false
        files: \.(py|smk|yaml)$
